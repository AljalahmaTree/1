<style>
:root{--br:#3A2416;--br2:#5A3A24;--car:#B8865B;--tan:#D9BE96;--bg:#F4E9D6;--card:#FBF5E9;--red:#a33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--br);font-family:'Tajawal',system-ui,sans-serif;color:var(--br)}
button{font-family:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--br);display:flex;align-items:center;justify-content:space-between;gap:6px}
.top h3{margin:0;font-family:'Aref Ruqaa',serif;font-size:24px;font-weight:700;color:var(--tan);text-align:center;flex:1}
.ib{background:none;border:0;color:var(--tan);font-size:24px;width:40px;height:40px;padding:0}

.seg{display:flex;background:var(--card);border:1px solid var(--car);border-radius:12px;padding:3px;margin-bottom:12px}

.seg button.on{background:var(--br2);color:var(--bg)}
.nd{width:64px;text-align:center;font-size:12px;padding:7px 2px 6px;border-radius:10px;background:var(--br2);border:1px solid var(--car);color:var(--bg);cursor:pointer;line-height:1.3}
.nd.root{border:2px solid var(--tan);background:var(--br)}
.ini{width:30px;height:30px;border-radius:50%;margin:0 auto 4px;background:var(--bg) center/cover;color:var(--br);display:flex;align-items:center;justify-content:center;font-family:'Aref Ruqaa',serif;font-size:17px;font-weight:700;box-shadow:0 0 0 2px var(--car)}
.br{display:flex;flex-direction:column;align-items:center}
.kids{display:flex;gap:6px;align-items:flex-start;border-top:1.5px solid var(--car);margin-top:10px}
.kid{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:10px}
.kid:before{content:"";position:absolute;top:0;width:1.5px;height:10px;background:var(--car)}
.stem{width:1.5px;height:10px;background:var(--car)}
.scrollx{overflow:auto;padding-bottom:8px;touch-action:pan-x pan-y}
.zb{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.zb button{background:var(--card);border:1px solid var(--car);color:var(--br2);border-radius:10px;height:36px;min-width:40px;padding:0 10px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.zb button i{font-size:18px}
.zb span{min-width:44px;text-align:center;font-size:13px;color:var(--br2)}
.scrollx>.in{width:max-content;min-width:100%;display:flex;justify-content:center}
.card{background:var(--card);border:1px solid rgba(184,134,91,.55);border-radius:14px;padding:12px;margin-bottom:10px}
.hero{background:var(--br);color:var(--bg);border-color:var(--br)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--car);color:var(--br2)}
.hero .tag{color:var(--tan);margin:2px}
.ttl{font-family:'Aref Ruqaa',serif;font-size:19px;color:var(--br2);margin:0}
.sec{font-family:'Aref Ruqaa',serif;font-size:20px;color:var(--br2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(184,134,91,.35);cursor:pointer;font-size:16px}
.row .ini{margin:0;flex:none;width:38px;height:38px;background-color:var(--br2);color:var(--bg)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--car);color:var(--br);border-radius:10px;height:42px;padding:0 10px;font-family:inherit;font-size:16px;margin-bottom:10px}
textarea{height:100px;padding:8px 10px;resize:none;line-height:1.7}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--br2)}
label{font-size:13px;color:var(--br2);display:block;margin-bottom:3px}
label.ck{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--br);margin:4px 0 10px}
.b{background:var(--br2);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px}
.b.w{width:100%}
.b.sm,.o.sm{padding:6px 12px;font-size:13px}
.b.ok{background:#2e7d32}
.o{background:transparent;color:var(--br2);border:1px solid var(--br2);border-radius:10px;padding:10px 16px;font-size:14px}
.o.w{width:100%}
.o.bad{color:var(--red);border-color:var(--red)}
.lk{background:transparent;border:0;color:var(--car);font-size:13px;padding:2px 0;display:inline-flex;align-items:center;gap:4px}
.hero .lk.l{color:var(--tan)}
.mut{color:rgba(58,36,22,.65);font-size:12px}
.hero .mut{color:rgba(244,233,214,.78)}
.c{text-align:center}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tc{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 12px}
.tic{width:44px;height:44px;border-radius:50%;background:var(--br2);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 0 0 2px var(--car)}
.nm{font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--br)}
.dash{border:1.5px dashed var(--car);background:transparent;justify-content:center;color:var(--br2);gap:8px;font-size:16px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
.dots span{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--car)}
.dots span.f{background:var(--car)}
.pav{position:relative;width:96px;height:96px;margin:0 auto;cursor:pointer}
.pav .ini{width:96px;height:96px;font-size:52px;margin:0;box-shadow:0 0 0 3px var(--car),0 0 0 6px var(--br)}
.cam{position:absolute;bottom:-2px;left:-2px;width:32px;height:32px;border-radius:50%;background:var(--car);color:var(--br);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 0 3px var(--br)}
.dl{font-size:14px;margin-top:8px;display:flex;flex-direction:column;gap:3px;align-items:center}
.center-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.okmsg{color:#2e7d32;font-size:13px}
.thumb{display:inline-block;width:44px;height:44px;border-radius:50%;background:center/cover;vertical-align:middle;border:2px solid var(--car)}
.chg{font-size:14px;line-height:1.8}
.chg .d{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.code{font-family:monospace;direction:ltr;display:inline-block;background:var(--bg);border:1px dashed var(--car);border-radius:8px;padding:4px 10px;font-size:16px}
.ag{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ac{background:var(--card);border:1px solid rgba(184,134,91,.55);border-radius:14px;overflow:hidden;cursor:pointer}
.ac .cv{aspect-ratio:1;background:var(--br2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--tan);font-size:38px}
.ac .am{padding:8px 10px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pg div{aspect-ratio:1;background:var(--br2) center/cover;cursor:pointer;border-radius:6px}
.vp{height:calc(100dvh - 330px);min-height:380px;background:rgba(251,245,233,.5);border:1px solid rgba(184,134,91,.35);border-radius:12px;padding:6px}
.fsw{flex:1;min-height:0;padding:0 8px 8px;display:flex;flex-direction:column}
.fsw .vp{height:100%;min-height:0;flex:1}
#pr{display:none}
#ped{position:fixed;inset:0;z-index:70;background:#E9DCC3;display:flex;flex-direction:column}#ped .pbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--br);color:#F4E9D6;flex-wrap:wrap}#ped .pbar span{font-size:13px;opacity:.85}#ped button{border:0;border-radius:10px;padding:8px 12px;font:inherit;background:var(--tan);color:var(--br);cursor:pointer}#ped button.pri{background:var(--car);color:#fff;font-weight:700}#ped .pwrap{flex:1;overflow:auto;padding:12px}#ped svg{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 12px #0003;width:100%;height:auto;touch-action:pan-x pan-y}#ped .pn{cursor:grab;touch-action:none}
@media print{#app,#modal,#toast,#ped{display:none!important}#pr{display:block;margin:0 auto}html,body{background:#F4E9D6!important;height:auto!important;overflow:visible!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}#pr svg{display:block;width:100%;height:100%}}
#modal{display:none;position:fixed;inset:0;background:rgba(40,22,12,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.mbox{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90dvh;overflow:auto}
.mbox h3{margin:0 0 12px;font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--br2)}
.mrow{display:flex;gap:8px}.mrow .b{flex:1}
.mbtn{display:block;width:100%;text-align:right;padding:12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--car);background:var(--card);color:var(--br);font-size:15px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--br);color:var(--tan);padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<style id="pst"></style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pr"></div>
<script type="module">
// ============ إعدادات Firebase ============
const firebaseConfig = {
  apiKey: "AIzaSyD4GYarO6zfV3k9Gl1eBe2ESK1J4Lz2N3U",
  authDomain: "aljtree-ae8c8.firebaseapp.com",
  projectId: "aljtree-ae8c8",
  appId: "1:605886484105:web:659fd6ce55c877105e4058"
};
// ==========================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, deleteUser } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, setDoc, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const MAX = 5;
const cfgOk = !firebaseConfig.apiKey.startsWith("PASTE");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("app");

let auth, db;
const S = { user: undefined, me: null, meta: null, people: [], branches: [], news: [], users: [], changes: [], secret: null, got: {}, dataOn: false, tab: 0, branchId: null, mode: "chart", full: false, zoom: 1, albums: [], photos: [], albumId: null, photosOn: false, profile: null, q: "", err: "", reg: false, regInfo: null, flash: "" };
let unsubs = [];

// ---------------- أدوات ----------------
const isAdmin = () => S.me?.role === "admin";
const isActive = () => isAdmin() || S.me?.status === "active";
const approved = () => S.people.filter(p => p.status === "approved");
const byId = id => S.people.find(p => p.id === id);
const mine = () => S.me?.personId ? byId(S.me.personId) : null;
const fullName = p => { const n = []; let c = p; while (c && n.length < 4) { n.push(c.name); c = byId(c.fatherId); } return n.join(" بن "); };
const bName = id => S.branches.find(b => b.id === id)?.name || "";
const myName = () => S.me?.name || S.me?.email || "عضو";
const userName = u => u.name || u.email || "—";
const photoSrc = p => (p && p.photo && /^[A-Za-z0-9+/=]+$/.test(p.photo)) ? "data:image/jpeg;base64," + p.photo : null;
const ini = p => { const s = photoSrc(p); return s ? `<div class="ini" style="background-image:url('${s}')"></div>` : `<div class="ini">${esc((p.name || "?")[0])}</div>`; };
const fmt = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? esc(s) : `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };
const yrs = (a, b) => { let n = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) n--; return n; };
const today = () => new Date().toISOString().slice(0, 10);
const ts = c => c.createdAt?.toMillis ? c.createdAt.toMillis() : 0;
// الأبناء: الأكبر أول (يظهر من اليمين). الترتيب المحفوظ ord، وإذا ما انحفظ نرتب بحسب وقت الإضافة
const orderKids = arr => arr.slice().sort((a, b) => (ts(a) - ts(b)) || (a.name || "").localeCompare(b.name || "", "ar")).map((p, i) => [p.ord ?? i, i, p]).sort((x, y) => (x[0] - y[0]) || (x[1] - y[1])).map(x => x[2]);
const kidsMap = list => { const m = {}; list.forEach(p => { if (p.fatherId) (m[p.fatherId] ||= []).push(p); }); Object.keys(m).forEach(k => m[k] = orderKids(m[k])); return m; };
const nextOrd = fid => { const sibs = S.people.filter(p => p.fatherId === fid); return Math.max(sibs.length, ...sibs.map(p => (p.ord ?? -1) + 1)); };
function gens(list) { const k = kidsMap(list); const d = (p, n = 0) => n > 40 ? 0 : 1 + Math.max(0, ...(k[p.id] || []).map(c => d(c, n + 1))); return Math.max(0, ...list.filter(p => !p.fatherId).map(p => d(p))); }
let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.className = "show"; clearTimeout(tt); tt = setTimeout(() => t.className = "", 3800); }
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function cleanPatch(p) {
  const o = {}; if (!p) return o;
  for (const k of ["job", "city"]) if (k in p) o[k] = String(p[k] ?? "").slice(0, 100);
  if ("bio" in p) o.bio = String(p.bio ?? "").slice(0, 2000);
  for (const k of ["birthDate", "deathDate"]) if (k in p) o[k] = (p[k] && DATE_RE.test(p[k])) ? p[k] : null;
  if ("photo" in p) o.photo = (p.photo && /^[A-Za-z0-9+/=]{20,}$/.test(p.photo) && p.photo.length < 200000) ? p.photo : null;
  return o;
}
const newPerson = (name, fatherId, branchId, ord = fatherId ? nextOrd(fatherId) : 0) => ({ name, fatherId, branchId, ord, status: "approved", job: "", city: "", bio: "", photo: null, birthDate: null, deathDate: null, createdAt: serverTimestamp() });

// ---------------- النوافذ ----------------
function ask(title, fields, ok = "حفظ", validate) {
  return new Promise(res => {
    const m = $("modal");
    const f2h = f => {
      const id = "f_" + f.k;
      if (f.type === "msg") return `<p>${esc(f.text)}</p>`;
      if (f.type === "check") return `<label class="ck" data-wrap="${f.k}"><input type="checkbox" id="${id}" ${f.value ? "checked" : ""}>${esc(f.label)}</label>`;
      let h = `<div data-wrap="${f.k}"><label for="${id}">${esc(f.label)}</label>`;
      if (f.type === "select") h += `<select id="${id}">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === f.value ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`;
      else if (f.type === "textarea") h += `<textarea id="${id}" placeholder="${esc(f.ph || "")}">${esc(f.value || "")}</textarea>`;
      else if (f.type === "date") h += `<input type="date" id="${id}" value="${esc(f.value || "")}" max="${today()}">`;
      else h += `<input id="${id}" value="${esc(f.value || "")}" placeholder="${esc(f.ph || "")}">`;
      return h + "</div>";
    };
    m.innerHTML = `<div class="mbox"><h3>${esc(title)}</h3>${fields.map(f2h).join("")}<div class="err" id="merr"></div><div class="mrow"><button class="b" id="mok">${esc(ok)}</button><button class="o" id="mno">إلغاء</button></div></div>`;
    m.className = "show";
    const close = v => { m.className = ""; m.innerHTML = ""; res(v); };
    const sync = () => fields.forEach(f => { if (f.showIf && $("f_" + f.showIf)) m.querySelector(`[data-wrap="${f.k}"]`).style.display = $("f_" + f.showIf).checked ? "block" : "none"; });
    m.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = sync); sync();
    $("mno").onclick = () => close(null);
    $("mok").onclick = () => {
      const v = {};
      fields.forEach(f => { if (f.type === "msg") return; const el = $("f_" + f.k); v[f.k] = f.type === "check" ? el.checked : el.value.trim(); });
      const e = validate ? validate(v) : "";
      if (e) { $("merr").textContent = e; return; }
      close(v);
    };
  });
}
const confirmBox = async text => !!(await ask("تأكيد", [{ type: "msg", text }], "نعم"));
function sheet(items) {
  const m = $("modal");
  m.innerHTML = `<div class="mbox">${items.map((it, i) => `<button class="mbtn" data-i="${i}">${esc(it.label)}</button>`).join("")}<button class="o w" id="mno">إغلاق</button></div>`;
  m.className = "show";
  const close = () => { m.className = ""; m.innerHTML = ""; };
  $("mno").onclick = close;
  m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { close(); items[+b.dataset.i].fn(); });
}

// ---------------- الدخول والبيانات ----------------
async function boot(u) {
  stop(); S.user = u; if (u) S.reg = false; S.me = null; S.got = {}; S.err = ""; S.dataOn = false;
  S.profile = null; S.branchId = null; S.tab = 0; S.q = ""; S.people = []; S.users = []; S.changes = []; S.albums = []; S.albumId = null;
  if (!u) { render(); return; }
  render();
  try {
    const uref = doc(db, "users", u.uid);
    if (!(await getDoc(uref)).exists()) {
      const info = S.regInfo; S.regInfo = null;
      let metaExists = true;
      try { metaExists = (await getDoc(doc(db, "meta", "app"))).exists(); } catch (_) { metaExists = true; }
      if (!metaExists) {
        // أول حساب في المشروع يصير المدير
        const b = writeBatch(db);
        b.set(doc(db, "meta", "app"), { familyName: "شجرة العائلة", adminUid: u.uid });
        b.set(uref, { role: "admin", status: "active", personId: null, email: u.email, name: info?.name || u.email, createdAt: serverTimestamp() });
        await b.commit();
      } else if (info) {
        try { await setDoc(uref, { role: "member", status: "pending", personId: null, email: u.email, name: info.name, code: info.code, createdAt: serverTimestamp() }); }
        catch (e) { S.flash = "رمز العائلة غير صحيح، أو المدير ما حدّد رمز بعد"; try { await deleteUser(u); } catch (_) { await signOut(auth); } return; }
      } else { S.flash = "هذا الحساب غير مسجل بالرمز. سجّل حساب جديد برمز العائلة."; await signOut(auth); return; }
    }
    start(u);
  } catch (e) { S.err = (e.code || "") + " — " + e.message; render(); }
}
function start(user) {
  unsubs.push(onSnapshot(doc(db, "users", user.uid), snap => {
    S.me = snap.exists() ? { uid: snap.id, ...snap.data() } : null; S.got.me = 1;
    if (S.me && isActive() && !S.dataOn) { S.dataOn = true; startData(user); }
    render();
  }, e => { S.err = (e.code || "") + " — " + e.message; render(); }));
}
function startData(user) {

function setZoom(z) {
  const sc = app.querySelector(".scrollx"), el = sc && sc.firstElementChild; if (!el) return;
  const how = typeof z === "string" ? z : null;

    el.style.zoom = 1; const r = el.getBoundingClientRect(), w = Math.max(1, r.width), h = Math.max(1, r.height);
    z = Math.min(1, (sc.clientWidth - 18) / w);
    if (how === "fit") z = Math.min(z, (sc.clientHeight - 18) / h); else z = Math.max(0.5, z);

    if (adm) { const b = writeBatch(db); const cur = orderKids(approved().filter(x => x.fatherId === p.id)); cur.forEach((k, i) => { if (k.ord !== i) b.update(doc(db, "people", k.id), { ord: i }); }); names.forEach((n, i) => b.set(doc(collection(db, "people")), newPerson(n, p.id, p.branchId, cur.length + i))); await b.commit(); toast(`تمت إضافة ${names.length} ${names.length > 10 ? "ولد" : "أبناء"}`); }
    else { for (const n of names) await addDoc(collection(db, "changes"), { type: "add", person: { name: n, fatherId: p.id }, by: S.user.uid, byName: myName(), status: "pending", createdAt: serverTimestamp() }); toast("أُرسل طلبك للمدير، وينتظر موافقته"); }
  },
  openAlbum: d => {
    stopPhotos(); S.albumId = d.id; render();
    pUn = onSnapshot(query(collection(db, "photos"), where("albumId", "==", d.id)), snap => { S.photos = snap.docs.map(x => ({ id: x.id, ...x.data() })); S.photosOn = true; render(); }, e => { S.photosOn = true; toast("تعذر تحميل الصور"); render(); });
  },
  newAlbum: async () => {
    const v = await ask(isAdmin() ? "ألبوم جديد" : "اقتراح ألبوم", [{ k: "n", label: "اسم الألبوم", ph: "مثال: ملتقى العائلة 2026" }], isAdmin() ? "إنشاء" : "إرسال الاقتراح", v => v.n ? "" : "اكتب اسم الألبوم");
    if (!v) return;
    const name = v.n.slice(0, 60);
    if (isAdmin()) { await addDoc(collection(db, "albums"), { name, count: 0, cover: null, createdAt: serverTimestamp() }); toast("تم إنشاء الألبوم"); }
    else await submitChange({ type: "album", album: { name } });
  },
  addPics: () => {
    const al = S.albums.find(a => a.id === S.albumId); if (!al) return;
    const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.multiple = true;
    i.onchange = async () => {
      const files = [...i.files].slice(0, 10); if (!files.length) return;
      toast("جاري تجهيز الصور…");
      try {
        const pics = []; for (const f of files) pics.push(await prep(f));
        if (isAdmin()) {
          const b = writeBatch(db);
          pics.forEach(x => b.set(doc(collection(db, "photos")), { albumId: al.id, img: x.img, thumb: x.thumb, by: S.user.uid, byName: myName(), createdAt: serverTimestamp() }));
          b.update(doc(db, "albums", al.id), { count: (al.count || 0) + pics.length, cover: al.cover || pics[0].thumb });
          await b.commit(); toast(`تمت إضافة ${pics.length} صورة`);
        } else {
          for (const x of pics) await addDoc(collection(db, "changes"), { type: "pic", pic: { albumId: al.id, img: x.img, thumb: x.thumb }, by: S.user.uid, byName: myName(), status: "pending", createdAt: serverTimestamp() });
          toast("أُرسل طلبك للمدير، وينتظر موافقته");
        }
      } catch (e) { console.error(e); toast("تعذر رفع الصور، حاول مرة ثانية"); }
    };
    i.click();
  },
  viewPic: d => {
    const p = S.photos.find(x => x.id === d.id), src = p && imgSrc(p.img); if (!src) return;
    const m = $("modal"), adm = isAdmin();
    m.innerHTML = `<div class="mbox" style="padding:10px"><img src="${src}" alt="" style="width:100%;border-radius:10px;display:block"><div class="mut" style="margin:8px 0">${p.byName ? "أضافها: " + esc(p.byName) : ""}</div><div class="mrow">${adm ? '<button class="o bad" id="pdel">حذف</button>' : ""}<button class="b" id="pno">إغلاق</button></div></div>`;
    m.className = "show";
    const close = () => { m.className = ""; m.innerHTML = ""; };
    $("pno").onclick = close;
    if (adm) $("pdel").onclick = async () => {
      close(); if (!(await confirmBox("حذف هذه الصورة؟"))) return;
      const al = S.albums.find(a => a.id === p.albumId), b = writeBatch(db);
      b.delete(doc(db, "photos", p.id));
      if (al) b.update(doc(db, "albums", al.id), { count: Math.max(0, (al.count || 1) - 1), cover: al.cover === p.thumb ? (S.photos.find(x => x.id !== p.id)?.thumb || null) : al.cover });
      await b.commit(); toast("تم الحذف");
    };
  },
  delAlbum: async () => {
    const al = S.albums.find(a => a.id === S.albumId); if (!al) return;
    if ((al.count || 0) > 0 || S.photos.length) { await ask("تنبيه", [{ type: "msg", text: "احذف صور الألبوم أول، وبعدين احذفه." }], "حسنًا"); return; }
    if (await confirmBox(`حذف ألبوم «${al.name}»؟`)) { await deleteDoc(doc(db, "albums", al.id)); S.albumId = null; stopPhotos(); render(); }
  },
  reorderKids: d => {
    const p = byId(d.id), ids = orderKids(approved().filter(x => x.fatherId === p.id)).map(x => x.id), m = $("modal");
    if (ids.length < 2) return;
    const draw = () => {
      m.innerHTML = `<div class="mbox"><h3>ترتيب أبناء ${esc(p.name)}</h3><p class="mut" style="margin:0 0 8px">الأول في القائمة هو الأكبر، ويظهر أول واحد من اليمين في الشجرة.</p>${ids.map((id, i) => `<div class="row" style="cursor:default"><b style="width:22px">${i + 1}</b><div style="flex:1">${esc(byId(id)?.name || "")}</div><button class="o sm" data-up="${i}" ${i ? "" : "disabled"} aria-label="رفع">↑</button><button class="o sm" data-dn="${i}" ${i < ids.length - 1 ? "" : "disabled"} aria-label="تنزيل">↓</button></div>`).join("")}<div class="mrow" style="margin-top:12px"><button class="b" id="rok">${isAdmin() ? "حفظ الترتيب" : "إرسال الاقتراح"}</button><button class="o" id="rno">إلغاء</button></div></div>`;
      m.className = "show";
      const mv = (i, j) => { [ids[i], ids[j]] = [ids[j], ids[i]]; draw(); };
      m.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mv(+b.dataset.up, +b.dataset.up - 1));
      m.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => mv(+b.dataset.dn, +b.dataset.dn + 1));
      $("rno").onclick = () => { m.className = ""; m.innerHTML = ""; };
      $("rok").onclick = async () => {
        m.className = ""; m.innerHTML = "";
        try {
          if (isAdmin()) { const b = writeBatch(db); ids.forEach((id, i) => { if (byId(id)?.ord !== i) b.update(doc(db, "people", id), { ord: i }); }); await b.commit(); toast("تم حفظ الترتيب"); }
          else await submitChange({ type: "order", order: { fatherId: p.id, ids } });
        } catch (e) { console.error(e); toast("تعذر الحفظ، حاول مرة ثانية"); }
      };
    };
    draw();
  },
  renBranch: async d => {
    const b = S.branches.find(x => x.id === d.id); if (!b) return;
    const v = await ask("تعديل اسم الفخذ", [{ k: "n", label: "اسم الفخذ", value: b.name }], "حفظ", v => v.n ? "" : "اكتب الاسم");
    if (v && v.n !== b.name) { await updateDoc(doc(db, "branches", b.id), { name: v.n.slice(0, 60) }); toast("تم تعديل الاسم"); }
  },
  delNews: async d => { if (await confirmBox("حذف هذا الخبر؟")) await deleteDoc(doc(db, "news", d.id)); },
  editBio: async d => { const p = byId(d.id); const v = await ask((isAdmin() ? "نبذة عن " : "اقتراح نبذة عن ") + p.name, [{ k: "b", type: "textarea", label: "النبذة", value: p.bio || "" }], isAdmin() ? "حفظ" : "إرسال الاقتراح"); if (v && v.b !== (p.bio || "")) await changePerson(p, { bio: v.b }); else if (v) toast("ما تغير شي"); },
  editInfo: async d => {
    const p = byId(d.id);
    const v = await ask(isAdmin() ? "تعديل المعلومات" : "اقتراح تعديل", [{ k: "job", label: "الوظيفة", value: p.job || "" }, { k: "city", label: "المدينة", value: p.city || "" }, { k: "b", type: "date", label: "تاريخ الميلاد", value: p.birthDate || "" }, { k: "dead", type: "check", label: "متوفي (رحمه الله)", value: !!p.deathDate }, { k: "d", type: "date", label: "تاريخ الوفاة", value: p.deathDate || "", showIf: "dead" }], isAdmin() ? "حفظ" : "إرسال الاقتراح",
      v => v.dead && !v.d ? "اكتب تاريخ الوفاة" : (v.dead && v.b && v.d < v.b ? "تاريخ الوفاة لازم يكون بعد الميلاد" : ""));
    if (!v) return;
    const patch = {}, nb = v.b || null, nd = v.dead ? v.d : null;
    if (v.job !== (p.job || "")) patch.job = v.job;
    if (v.city !== (p.city || "")) patch.city = v.city;
    if (nb !== (p.birthDate || null)) patch.birthDate = nb;
    if (nd !== (p.deathDate || null)) patch.deathDate = nd;
    await changePerson(p, patch);
  },
  photo: d => pickPhoto(d.id),
  delPhoto: async d => { const p = byId(d.id); await changePerson(p, { photo: null }); },
  delPerson: async d => {
    if (d.kids === "1") { await ask("تنبيه", [{ type: "msg", text: "احذف الأبناء أول." }], "حسنًا"); return; }
    const p = byId(d.id); if (await confirmBox(`حذف ${p.name} من الشجرة؟`)) { await deleteDoc(doc(db, "people", p.id)); S.profile = null; render(); }
  },
  // ----- الإدارة -----
  linkUser: async d => {
    const u = S.users.find(x => x.uid === d.id); if (!u) return;
    const linked = new Set(S.users.filter(x => x.uid !== u.uid).map(x => x.personId).filter(Boolean));
    const free = approved().filter(p => !linked.has(p.id));
    if (!free.length) return toast("كل الأفراد مربوطين بحسابات");
    const v = await ask("ربط " + userName(u) + " بشخص", [{ k: "p", type: "select", label: "اختر الشخص في الشجرة", value: u.personId || "", options: free.map(p => ({ v: p.id, l: `${fullName(p)} — ${bName(p.branchId)}` })) }], "ربط");
    if (!v) return;
    const upd = { personId: v.p }; if (u.role !== "admin") upd.status = "active";
    await updateDoc(doc(db, "users", u.uid), upd); toast("تم الربط");
  },
  newFromUser: async d => {
    const u = S.users.find(x => x.uid === d.id), all = approved(); if (!u) return;
    if (!all.length) return toast("ضيف الفخذ الأول وأفراده أول");
    const v = await ask("إضافة " + userName(u) + " للشجرة", [{ k: "n", label: "الاسم في الشجرة", value: u.name || "" }, { k: "f", type: "select", label: "اسم الأب", options: all.map(p => ({ v: p.id, l: `${fullName(p)} — ${bName(p.branchId)}` })) }], "إضافة وقبول", v => v.n ? "" : "اكتب الاسم");
    if (!v) return;
    const f = byId(v.f), pr = doc(collection(db, "people")), b = writeBatch(db);
    b.set(pr, newPerson(v.n, f.id, f.branchId)); b.update(doc(db, "users", u.uid), { status: "active", personId: pr.id }); await b.commit(); toast("تمت الإضافة والقبول");
  },
  rejectUser: async d => { if (await confirmBox("رفض هذا الطلب؟")) await updateDoc(doc(db, "users", d.id), { status: "rejected" }); },
  blockUser: async d => { if (await confirmBox("إيقاف هذا الحساب؟ ما يقدر يدخل بعدها.")) await updateDoc(doc(db, "users", d.id), { status: "blocked" }); },
  unblockUser: async d => { await updateDoc(doc(db, "users", d.id), { status: "active" }); toast("تم التفعيل"); },
  okChange: async d => {
    const c = S.changes.find(x => x.id === d.id); if (!c) return;
    const b = writeBatch(db);
    if (c.type === "edit") { const p = byId(c.personId); if (!p) return toast("الشخص محذوف، ارفض الطلب"); const patch = cleanPatch(c.patch); if (!Object.keys(patch).length) return toast("الطلب فاضي، ارفضه"); b.update(doc(db, "people", p.id), patch); }
    else if (c.type === "add") { const f = byId(c.person?.fatherId), nm = String(c.person?.name || "").trim().slice(0, 60); if (!f) return toast("الأب غير موجود، ارفض الطلب"); if (!nm) return toast("الاسم فاضي، ارفض الطلب"); b.set(doc(collection(db, "people")), newPerson(nm, f.id, f.branchId)); }
    else if (c.type === "news") { const t = NT[c.news?.type] ? c.news.type : "event", tx = String(c.news?.text || "").trim().slice(0, 2000); if (!tx) return toast("الخبر فاضي، ارفض الطلب"); b.set(doc(collection(db, "news")), { type: t, text: tx, createdAt: serverTimestamp() }); }
    else if (c.type === "order") {
      const f = byId(c.order?.fatherId); if (!f) return toast("الأب غير موجود، ارفض الطلب");
      const cur = orderKids(approved().filter(x => x.fatherId === f.id)), want = (Array.isArray(c.order.ids) ? c.order.ids : []).filter(id => cur.some(x => x.id === id));
      const fin = [...new Set([...want, ...cur.map(x => x.id)])]; if (!want.length) return toast("الطلب فاضي، ارفضه");
      fin.forEach((id, i) => b.update(doc(db, "people", id), { ord: i }));
    }
    else if (c.type === "album") { const nm = String(c.album?.name || "").trim().slice(0, 60); if (!nm) return toast("الاسم فاضي، ارفض الطلب"); b.set(doc(collection(db, "albums")), { name: nm, count: 0, cover: null, createdAt: serverTimestamp() }); }
    else if (c.type === "pic") {
      const al = S.albums.find(a => a.id === c.pic?.albumId); if (!al) return toast("الألبوم غير موجود، ارفض الطلب");
      const im = c.pic.img, th = c.pic.thumb; if (!imgSrc(im) || !imgSrc(th) || im.length > 250000) return toast("الصورة غير صالحة، ارفض الطلب");
      b.set(doc(collection(db, "photos")), { albumId: al.id, img: im, thumb: th, by: c.by, byName: c.byName || "", createdAt: serverTimestamp() });
      b.update(doc(db, "albums", al.id), { count: (al.count || 0) + 1, cover: al.cover || th });
    }
    else return;
    b.delete(doc(db, "changes", c.id)); await b.commit(); toast("تم اعتماد الطلب");
  },
  noChange: async d => { if (await confirmBox("رفض هذا الطلب؟")) { await updateDoc(doc(db, "changes", d.id), { status: "rejected" }); toast("تم الرفض"); } },
  setCode: async () => {
    const v = await ask("رمز العائلة", [{ k: "c", label: "الرمز (6 أحرف أو أكثر)", value: S.secret || "" }], "حفظ", v => v.c.length < 6 ? "الرمز قصير، اكتب 6 أحرف على الأقل" : "");
    if (v) { await setDoc(doc(db, "meta", "secret"), { code: v.c }); toast("تم حفظ الرمز"); }
  }
};
async function renameFamily() { const v = await ask("اسم العائلة", [{ k: "n", label: "الاسم", value: S.meta?.familyName || "" }], "حفظ", v => v.n ? "" : "اكتب الاسم"); if (v) await updateDoc(doc(db, "meta", "app"), { familyName: v.n }); }
function pickPhoto(id) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const s = 160, m = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = s;
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(img.src);
      changePerson(byId(id), { photo: c.toDataURL("image/jpeg", .6).split(",")[1] }).catch(e => toast("تعذر الحفظ"));
    };
    img.src = URL.createObjectURL(f);
  };
  i.click();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]");
  if (!t || !A[t.dataset.a] || $("modal").contains(t)) return;
  try { await A[t.dataset.a](t.dataset, e); }
  catch (err) { console.error(err); toast(err.code === "permission-denied" ? "ما عندك صلاحية لهذي العملية" : "تعذر تنفيذ العملية، حاول مرة ثانية"); }
});
document.addEventListener("input", e => { if (e.target.id === "s") { S.q = e.target.value; $("ls").innerHTML = membersList(); } });

// ---------------- التشغيل ----------------
if (cfgOk) {
  const fb = initializeApp(firebaseConfig); auth = getAuth(fb); db = getFirestore(fb);
  onAuthStateChanged(auth, u => { boot(u); });
}
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (_) {} }
render();
</script>
