<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شجرة العائلة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>شجرة العائلة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--br:#3A2416;--br2:#5A3A24;--car:#B8865B;--tan:#D9BE96;--bg:#F4E9D6;--card:#FBF5E9;--red:#a33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--br);font-family:'Tajawal',system-ui,sans-serif;color:var(--br)}
button{font-family:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.top{padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--br);display:flex;align-items:center;justify-content:space-between;gap:6px}
.top h3{margin:0;font-family:'Aref Ruqaa',serif;font-size:24px;font-weight:700;color:var(--tan);text-align:center;flex:1}
.ib{background:none;border:0;color:var(--tan);font-size:24px;width:40px;height:40px;padding:0}
.bd{flex:1;overflow:auto;padding:14px}
.nav{display:flex;background:var(--br);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:transparent;color:var(--tan);opacity:.6;padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-size:22px}
.nav button.on{opacity:1;color:#F4E9D6;background:var(--br2);box-shadow:inset 0 2px 0 var(--car)}
.badge{background:#c0392b;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;margin-right:4px}
.seg{display:flex;background:var(--card);border:1px solid var(--car);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--br2);border-radius:9px;padding:7px 0;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--br2);color:var(--bg)}
.nd{width:64px;text-align:center;font-size:12px;padding:7px 2px 6px;border-radius:10px;background:var(--br2);border:1px solid var(--car);color:var(--bg);cursor:pointer;line-height:1.3}
.nd.root{border:2px solid var(--tan);background:var(--br)}
.ini{width:30px;height:30px;border-radius:50%;margin:0 auto 4px;background:var(--bg) center/cover;color:var(--br);display:flex;align-items:center;justify-content:center;font-family:'Aref Ruqaa',serif;font-size:17px;font-weight:700;box-shadow:0 0 0 2px var(--car)}
.br{display:flex;flex-direction:column;align-items:center}
.kids{display:flex;gap:6px;align-items:flex-start;border-top:1.5px solid var(--car);margin-top:10px}
.kid{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:10px}
.kid:before{content:"";position:absolute;top:0;width:1.5px;height:10px;background:var(--car)}
.stem{width:1.5px;height:10px;background:var(--car)}
.scrollx{overflow-x:auto;padding-bottom:8px}
.scrollx>.in{width:max-content;min-width:100%;display:flex;justify-content:center}
.card{background:var(--card);border:1px solid rgba(184,134,91,.55);border-radius:14px;padding:12px;margin-bottom:10px}
.hero{background:var(--br);color:var(--bg);border-color:var(--br)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--car);color:var(--br2)}
.hero .tag{color:var(--tan);margin:2px}
.ttl{font-family:'Aref Ruqaa',serif;font-size:19px;color:var(--br2);margin:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(184,134,91,.35);cursor:pointer;font-size:16px}
.row .ini{margin:0;flex:none;width:38px;height:38px;background-color:var(--br2);color:var(--bg)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--car);color:var(--br);border-radius:10px;height:42px;padding:0 10px;font-family:inherit;font-size:16px;margin-bottom:10px}
textarea{height:100px;padding:8px 10px;resize:none;line-height:1.7}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--br2)}
label{font-size:13px;color:var(--br2);display:block;margin-bottom:3px}
label.ck{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--br);margin:4px 0 10px}
.b{background:var(--br2);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px}
.b.w{width:100%}
.o{background:transparent;color:var(--br2);border:1px solid var(--br2);border-radius:10px;padding:10px 16px;font-size:14px}
.o.w{width:100%}
.lk{background:transparent;border:0;color:var(--car);font-size:13px;padding:2px 0;display:inline-flex;align-items:center;gap:4px}
.hero .lk.l{color:var(--tan)}
.mut{color:rgba(58,36,22,.65);font-size:12px}
.hero .mut{color:rgba(244,233,214,.78)}
.c{text-align:center}
.tc{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px 12px}
.tic{width:44px;height:44px;border-radius:50%;background:var(--br2);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 0 0 2px var(--car)}
.nm{font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--br)}
.dash{border:1.5px dashed var(--car);background:transparent;justify-content:center;color:var(--br2);gap:8px;font-size:16px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}
.dots span{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--car)}
.dots span.f{background:var(--car)}
.pav{position:relative;width:96px;height:96px;margin:0 auto;cursor:pointer}
.pav .ini{width:96px;height:96px;font-size:52px;margin:0;box-shadow:0 0 0 3px var(--car),0 0 0 6px var(--br)}
.cam{position:absolute;bottom:-2px;left:-2px;width:32px;height:32px;border-radius:50%;background:var(--car);color:var(--br);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 0 3px var(--br)}
.dl{font-size:14px;margin-top:8px;display:flex;flex-direction:column;gap:3px;align-items:center}
.center-screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.okmsg{color:#2e7d32;font-size:13px}
#modal{display:none;position:fixed;inset:0;background:rgba(40,22,12,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.mbox{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90dvh;overflow:auto}
.mbox h3{margin:0 0 12px;font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--br2)}
.mrow{display:flex;gap:8px}.mrow .b{flex:1}
.mbtn{display:block;width:100%;text-align:right;padding:12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--car);background:var(--card);color:var(--br);font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script type="module">
// ============ إعدادات Firebase (الصقها من لوحة Firebase، انظر README) ============
const firebaseConfig = {
  apiKey: "AIzaSyD4GYarO6zfV3k9Gl1eBe2ESK1J4Lz2N3U",
  authDomain: "aljtree-ae8c8.firebaseapp.com",
  projectId: "aljtree-ae8c8",
  appId: "1:605886484105:web:659fd6ce55c877105e4058"
};
// ====================================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, getDoc, addDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const MAX = 5;
const cfgOk = !firebaseConfig.apiKey.startsWith("PASTE");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("app");

let auth, db;
const S = { user: undefined, me: null, meta: null, people: [], branches: [], news: [], got: {}, tab: 0, branchId: null, organic: false, profile: null, q: "", ob: 0, err: "" };
let unsubs = [];

// ---------------- أدوات ----------------
const isAdmin = () => S.me && S.me.role === "admin";
const approved = () => S.people.filter(p => p.status === "approved");
const mine = () => S.people.find(p => p.id === S.me?.personId);
const byId = id => S.people.find(p => p.id === id);
const bName = id => S.branches.find(b => b.id === id)?.name || "";
const photoSrc = p => (p.photo && /^[A-Za-z0-9+/=]+$/.test(p.photo)) ? "data:image/jpeg;base64," + p.photo : null;
const ini = (p) => { const s = photoSrc(p); return s ? `<div class="ini" style="background-image:url('${s}')"></div>` : `<div class="ini">${esc((p.name || "?")[0])}</div>`; };
const fmt = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? esc(s) : `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };
const yrs = (a, b) => { let n = b.getFullYear() - a.getFullYear(); if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) n--; return n; };
const today = () => new Date().toISOString().slice(0, 10);
const kidsMap = list => { const m = {}; list.forEach(p => { if (p.fatherId) (m[p.fatherId] ||= []).push(p); }); return m; };
function gens(list) { const k = kidsMap(list); const d = (p, n = 0) => n > 40 ? 0 : 1 + Math.max(0, ...(k[p.id] || []).map(c => d(c, n + 1))); return Math.max(0, ...list.filter(p => !p.fatherId).map(p => d(p))); }

// ---------------- نافذة الإدخال ----------------
function ask(title, fields, ok = "حفظ", validate) {
  return new Promise(res => {
    const m = $("modal");
    const f2h = f => {
      const id = "f_" + f.k;
      let h = "";
      if (f.type === "msg") return `<p>${esc(f.text)}</p>`;
      if (f.type === "check") return `<label class="ck" data-wrap="${f.k}"><input type="checkbox" id="${id}" ${f.value ? "checked" : ""}>${esc(f.label)}</label>`;
      h += `<div data-wrap="${f.k}"><label for="${id}">${esc(f.label)}</label>`;
      if (f.type === "select") h += `<select id="${id}">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === f.value ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`;
      else if (f.type === "textarea") h += `<textarea id="${id}" placeholder="${esc(f.ph || "")}">${esc(f.value || "")}</textarea>`;
      else if (f.type === "date") h += `<input type="date" id="${id}" value="${esc(f.value || "")}" max="${today()}">`;
      else h += `<input id="${id}" value="${esc(f.value || "")}" placeholder="${esc(f.ph || "")}">`;
      return h + "</div>";
    };
    m.innerHTML = `<div class="mbox"><h3>${esc(title)}</h3>${fields.map(f2h).join("")}<div class="err" id="merr"></div><div class="mrow"><button class="b" id="mok">${esc(ok)}</button><button class="o" id="mno">إلغاء</button></div></div>`;
    m.className = "show";
    const close = v => { m.className = ""; m.innerHTML = ""; res(v); };
    const sync = () => fields.forEach(f => { if (f.showIf) $("f_" + f.showIf) && (m.querySelector(`[data-wrap="${f.k}"]`).style.display = $("f_" + f.showIf).checked ? "block" : "none"); });
    m.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = sync); sync();
    $("mno").onclick = () => close(null);
    $("mok").onclick = () => {
      const v = {};
      fields.forEach(f => { if (f.type === "msg") return; const el = $("f_" + f.k); v[f.k] = f.type === "check" ? el.checked : el.value.trim(); });
      const e = validate ? validate(v) : "";
      if (e) { $("merr").textContent = e; return; }
      close(v);
    };
  });
}
const confirmBox = async text => !!(await ask("تأكيد", [{ type: "msg", text }], "نعم"));
function sheet(items) {
  const m = $("modal");
  m.innerHTML = `<div class="mbox">${items.map((it, i) => `<button class="mbtn" data-i="${i}">${esc(it.label)}</button>`).join("")}<button class="o w" id="mno">إغلاق</button></div>`;
  m.className = "show";
  const close = () => { m.className = ""; m.innerHTML = ""; };
  $("mno").onclick = close;
  m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { close(); items[+b.dataset.i].fn(); });
}

// ---------------- Firebase ----------------
async function ensureUser(u) {
  const ref = doc(db, "users", u.uid);
  if ((await getDoc(ref)).exists()) return;
  const metaRef = doc(db, "meta", "app");
  const meta = await getDoc(metaRef);
  const b = writeBatch(db);
  if (!meta.exists()) {
    b.set(metaRef, { familyName: "شجرة العائلة", adminUid: u.uid });
    b.set(ref, { role: "admin", email: u.email, personId: null });
  } else b.set(ref, { role: "member", email: u.email, personId: null });
  await b.commit();
}
function start(user) {
  stop(); S.got = {}; S.err = "";
  const sub = (key, ref, fn) => unsubs.push(onSnapshot(ref, snap => { fn(snap); S.got[key] = 1; render(); }, e => { S.err = e.code + " — " + e.message; render(); }));
  sub("me", doc(db, "users", user.uid), s => S.me = s.exists() ? { uid: s.id, ...s.data() } : null);
  sub("meta", doc(db, "meta", "app"), s => S.meta = s.data() || null);
  sub("people", collection(db, "people"), s => S.people = s.docs.map(d => ({ id: d.id, ...d.data() })));
  sub("branches", query(collection(db, "branches"), orderBy("createdAt")), s => S.branches = s.docs.map(d => ({ id: d.id, name: d.data().name })));
  sub("news", query(collection(db, "news"), orderBy("createdAt", "desc")), s => S.news = s.docs.map(d => ({ id: d.id, ...d.data() })));
}
function stop() { unsubs.forEach(u => u()); unsubs = []; }

// ---------------- الشجرة ----------------
function avatarSvg(p, cx, cy, r, big) {
  const s = photoSrc(p);
  if (s) return `<clipPath id="c${esc(p.id)}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><image href="${s}" x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#c${esc(p.id)})"/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F4E9D6"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="${big ? 16 : 14}" font-weight="700" fill="#3A2416" style="font-family:'Aref Ruqaa',serif">${esc((p.name || "?")[0])}</text>`;
}
function treeSvg(P) {
  const kids = kidsMap(P), root = P.find(p => !p.fatherId);
  if (!root) return '<p class="mut c">ما فيه أفراد بعد</p>';
  let slot = 0, md = 0; const pos = {};
  const lay = (p, d) => { if (d > 40) return 0; md = Math.max(md, d); const k = kids[p.id] || []; let x; if (!k.length) x = 78 * slot++; else { const xs = k.map(c => lay(c, d + 1)); x = xs.reduce((a, b) => a + b) / xs.length; } pos[p.id] = { x, d }; return x; };
  lay(root, 0);
  const sp = md ? Math.min(125, 300 / md) : 0;
  const xs = Object.values(pos).map(o => o.x), mn = Math.min(...xs), mx = Math.max(...xs);
  const W = Math.max(312, mx - mn + 90), off = W / 2 - (mn + mx) / 2;
  Object.values(pos).forEach(o => { o.x += off; o.y = 380 - o.d * sp; });
  const r = pos[root.id];
  let s = `<ellipse cx="${r.x}" cy="462" rx="80" ry="10" fill="#D9BE96"/><path d="M${r.x - 30} 464 Q${r.x - 8} 455 ${r.x} 440 Q${r.x + 8} 455 ${r.x + 30} 464" fill="none" stroke="#5A3A24" stroke-width="6" stroke-linecap="round"/><path d="M${r.x} 462 L${r.x} ${r.y}" stroke="#5A3A24" stroke-width="18" stroke-linecap="round"/>`;
  P.forEach(p => { if (!p.fatherId || !pos[p.id] || !pos[p.fatherId]) return; const a = pos[p.fatherId], b = pos[p.id], m = (a.y + b.y) / 2; s += `<path d="M${a.x} ${a.y} C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}" fill="none" stroke="${b.d === 1 ? "#7A5233" : "#B8865B"}" stroke-width="${b.d === 1 ? 9 : 4}" stroke-linecap="round"/>`; });
  P.forEach(p => {
    const q = pos[p.id]; if (!q) return;
    const rt = !p.fatherId, w = rt ? 78 : 64, h = rt ? 32 : 26, cx = q.x + w / 2 - h / 2, rr = h / 2 - 4;
    s += `<g data-a="prof" data-id="${esc(p.id)}" style="cursor:pointer"><rect x="${q.x - w / 2}" y="${q.y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${rt ? "#3A2416" : "#5A3A24"}" stroke="${rt ? "#D9BE96" : "#B8865B"}" stroke-width="${rt ? 2 : 1.2}"/>${avatarSvg(p, cx, q.y, rr, rt)}<text x="${q.x - h / 4 + 2}" y="${q.y + 4.5}" text-anchor="middle" font-size="${rt ? 14 : 12}" fill="#F4E9D6" style="font-family:'Tajawal',sans-serif">${esc(p.name)}</text></g>`;
  });
  return `<div class="scrollx"><svg viewBox="0 0 ${W} 480" style="width:${W > 312 ? W + "px" : "100%"};display:block;margin:auto" role="img" aria-label="شجرة الفخذ">${s}</svg></div>`;
}
function chart(P) {
  const kids = kidsMap(P), root = P.find(p => !p.fatherId);
  if (!root) return '<p class="mut c">ما فيه أفراد بعد</p>';
  const node = p => `<div class="nd${p.fatherId ? "" : " root"}" data-a="prof" data-id="${esc(p.id)}">${ini(p)}${esc(p.name)}</div>`;
  const br = (p, n = 0) => { const k = n > 40 ? [] : (kids[p.id] || []); let h = `<div class="br">${node(p)}`; if (k.length) h += `<div class="stem"></div><div class="kids" style="${k.length === 1 ? "border-top:0" : ""}">${k.map(c => `<div class="kid">${br(c, n + 1)}</div>`).join("")}</div>`; return h + "</div>"; };
  return `<div class="scrollx"><div class="in">${br(root)}</div></div>`;
}
function treeTab() {
  const admin = isAdmin(), b = S.branches.find(x => x.id === S.branchId);
  if (!b) {
    const dots = Array.from({ length: MAX }, (_, i) => `<span class="${i < S.branches.length ? "f" : ""}"></span>`).join("");
    return `<div class="dots">${dots}</div><p class="mut c" style="margin:0 0 14px">${S.branches.length} من ${MAX} أفخاذ</p>` +
      (S.branches.length ? "" : `<p class="c" style="padding:24px 0">${admin ? "ابدأ بإضافة أول فخذ" : "المدير لسا ما أضاف أفخاذ"}</p>`) +
      S.branches.map(x => { const m = approved().filter(p => p.branchId === x.id); return `<div class="card tc" data-a="openB" data-id="${esc(x.id)}"><div class="tic"><i class="ti ti-tree"></i></div><div style="flex:1"><div class="nm">${esc(x.name)}</div><div class="mut">${m.length} أفراد · ${gens(m)} أجيال</div></div><i class="ti ti-chevron-left" style="color:var(--car)"></i></div>`; }).join("") +
      (admin && S.branches.length < MAX ? `<div class="card tc dash" data-a="newBranch"><i class="ti ti-plus"></i>إضافة فخذ جديد</div>` : "") +
      (S.branches.length >= MAX ? `<p class="mut c">وصلت للحد الأقصى (${MAX} أفخاذ)</p>` : "");
  }
  const m = approved().filter(p => p.branchId === b.id);
  return `<div class="seg"><button class="${S.organic ? "" : "on"}" data-a="view" data-v="chart"><i class="ti ti-hierarchy-2"></i>مخطط</button><button class="${S.organic ? "on" : ""}" data-a="view" data-v="tree"><i class="ti ti-tree"></i>شجرة</button></div>` +
    (S.organic ? treeSvg(m) : chart(m)) +
    `<p class="mut c" style="margin:12px 0">اضغط على أي شخص لفتح ملفه</p>` +
    (admin ? `<button class="b w" data-a="addMember"><i class="ti ti-user-plus"></i> إضافة فرد</button>` : "");
}

// ---------------- الأخبار والأعضاء ----------------
const NT = { birth: ["مولود جديد", "ti-baby-carriage"], wedding: ["زواج", "ti-ring"], grad: ["تخرج", "ti-school"], condolence: ["تعزية", "ti-heart-broken"], event: ["مناسبة", "ti-users-group"] };
function newsTab() {
  const items = S.news.map(n => { const t = NT[n.type] || NT.event, d = n.createdAt?.toDate ? n.createdAt.toDate() : null; return `<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><i class="ti ${t[1]}" style="color:var(--car);font-size:22px"></i><span class="tag">${t[0]}</span><span class="mut" style="margin-right:auto">${d ? `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}` : ""}</span>${isAdmin() ? `<button class="lk" data-a="delNews" data-id="${esc(n.id)}"><i class="ti ti-trash"></i></button>` : ""}</div><div style="font-size:15px;line-height:1.8">${esc(n.text)}</div></div>`; }).join("");
  return (items || '<p class="mut c" style="padding:30px 0">ما فيه أخبار بعد</p>') + (isAdmin() ? `<button class="b w" data-a="addNews"><i class="ti ti-plus"></i> إضافة خبر</button><p class="mut c" style="margin-top:8px">بعد النشر، شارك رابط التطبيق في قروب العائلة عشان يعرفون.</p>` : "");
}
function membersList() {
  const l = approved().filter(p => (p.name || "").includes(S.q)).sort((a, b) => a.name.localeCompare(b.name, "ar"));
  return l.map(p => `<div class="row" data-a="prof" data-id="${esc(p.id)}">${ini(p)}<div style="flex:1">${esc(p.name)}${p.deathDate ? ' <span class="mut">(رحمه الله)</span>' : ""}<div class="mut">${esc([p.job, p.city].filter(Boolean).join(" · ") || "—")}</div></div><span class="tag">${esc(bName(p.branchId))}</span></div>`).join("") || '<p class="mut c">ما لقيت أحد</p>';
}
function membersTab() {
  const pend = S.people.filter(p => p.status !== "approved");
  const ph = isAdmin() && pend.length ? `<p class="ttl" style="margin-bottom:8px">طلبات الانضمام</p>` + pend.map(p => `<div class="card" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><div style="font-size:16px">${esc(p.name)}</div><div class="mut">ابن ${esc(byId(p.fatherId)?.name || "—")} · ${esc(bName(p.branchId))}</div></div><button class="lk" style="font-size:26px;color:#2e7d32" data-a="approve" data-id="${esc(p.id)}"><i class="ti ti-circle-check"></i></button><button class="lk" style="font-size:26px;color:var(--red)" data-a="reject" data-id="${esc(p.id)}"><i class="ti ti-circle-x"></i></button></div>`).join("") : "";
  return ph + `<input id="s" placeholder="ابحث بالاسم في كل الأفخاذ" value="${esc(S.q)}"><div id="ls">${membersList()}</div>`;
}

// ---------------- الملف الشخصي ----------------
function profileView() {
  const p = byId(S.profile); if (!p) return '<p class="c">هذا الشخص غير موجود</p>';
  const canEdit = isAdmin() || p.uid === S.user.uid, fa = byId(p.fatherId), dead = !!p.deathDate;
  const birth = p.birthDate ? new Date(p.birthDate + "T00:00:00") : null, end = dead ? new Date(p.deathDate + "T00:00:00") : new Date();
  let age = ""; if (birth && !isNaN(birth)) { const a = yrs(birth, end); age = a < 1 ? "أقل من سنة" : a + " سنة"; }
  const tags = [p.job && `<span class="tag"><i class="ti ti-briefcase"></i> ${esc(p.job)}</span>`, p.city && `<span class="tag"><i class="ti ti-map-pin"></i> ${esc(p.city)}</span>`].filter(Boolean).join("");
  const dates = (p.birthDate ? `<div><i class="ti ti-cake" style="color:var(--tan)"></i> وُلد ${fmt(p.birthDate)}${dead ? "" : " · العمر " + age}</div>` : "") + (dead ? `<div><i class="ti ti-heart" style="color:var(--tan)"></i> توفي ${fmt(p.deathDate)}${p.birthDate ? " · عاش " + age : ""}</div>` : "");
  const hasKids = S.people.some(x => x.fatherId === p.id);
  return `<div class="card hero c" style="padding:20px 12px 16px"><div class="pav" ${canEdit ? `data-a="photo" data-id="${esc(p.id)}"` : ""}>${ini(p)}${canEdit ? '<div class="cam"><i class="ti ti-camera"></i></div>' : ""}</div>
<div style="font-family:'Aref Ruqaa',serif;font-size:28px;color:var(--tan);margin-top:12px">${esc(p.name)}${dead ? ' <span style="font-size:16px">رحمه الله</span>' : ""}</div>
<div class="mut">${fa ? "ابن " + esc(fa.name) : "رأس الفخذ"}</div>
<div style="margin-top:10px">${tags || '<span class="mut">ما أضيفت معلومات بعد</span>'}</div><div class="dl">${dates}</div>
${canEdit ? `<div style="margin-top:12px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap"><button class="lk l" data-a="photo" data-id="${esc(p.id)}"><i class="ti ti-photo-plus"></i>${p.photo ? "تغيير الصورة" : "إضافة صورة"}</button>${p.photo ? `<button class="lk l" data-a="delPhoto" data-id="${esc(p.id)}"><i class="ti ti-trash"></i>إزالة</button>` : ""}<button class="lk l" data-a="editInfo" data-id="${esc(p.id)}"><i class="ti ti-edit"></i>تعديل المعلومات</button></div>` : ""}</div>
<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><p class="ttl">نبذة</p>${canEdit ? `<button class="lk" data-a="editBio" data-id="${esc(p.id)}"><i class="ti ti-pencil"></i>${p.bio ? "تعديل" : "إضافة"}</button>` : ""}</div><div style="font-size:15px;line-height:1.9">${p.bio ? esc(p.bio) : '<span class="mut">ما أضيفت نبذة بعد</span>'}</div></div>
${isAdmin() ? `<button class="o w" style="color:var(--red);border-color:var(--red)" data-a="delPerson" data-id="${esc(p.id)}" data-kids="${hasKids ? 1 : 0}"><i class="ti ti-trash"></i> حذف من الشجرة</button>` : ""}`;
}

// ---------------- الدخول والانضمام ----------------
function authView() {
  app.innerHTML = `<div class="center-screen"><div class="c"><i class="ti ti-tree" style="font-size:60px;color:var(--br2)"></i><div style="font-family:'Aref Ruqaa',serif;font-size:36px;color:var(--br2)">شجرة العائلة</div></div>
<div style="margin-top:14px"><label for="em">الإيميل</label><input id="em" type="email" dir="ltr" autocomplete="email"><label for="pw">كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password"><div class="err" id="aerr"></div><button class="b w" id="go" data-a="login" style="padding:13px">${S.reg ? "إنشاء حساب" : "دخول"}</button>
<p class="c"><button class="lk" data-a="toggleReg">${S.reg ? "عندك حساب؟ ادخل" : "ما عندك حساب؟ سجّل"}</button></p>${S.reg ? "" : '<p class="c"><button class="lk" data-a="reset">نسيت كلمة المرور</button></p>'}</div></div>`;
}
const aerr = (t, ok) => { const e = $("aerr"); if (e) { e.className = ok ? "okmsg" : "err"; e.textContent = t; } };
const authMsg = c => ({ "auth/invalid-email": "الإيميل غير صحيح", "auth/user-not-found": "الإيميل أو كلمة المرور غير صحيحة", "auth/wrong-password": "الإيميل أو كلمة المرور غير صحيحة", "auth/invalid-credential": "الإيميل أو كلمة المرور غير صحيحة", "auth/email-already-in-use": "هذا الإيميل مسجل من قبل", "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)", "auth/network-request-failed": "ما فيه اتصال بالإنترنت" }[c] || "صار خطأ، حاول مرة ثانية");
const logoutBtn = `<button class="lk" data-a="logout" style="margin:auto"><i class="ti ti-logout"></i>تسجيل خروج</button>`;
function onboardView() {
  const ppl = approved();
  let body;
  if (S.ob === 0) body = `<div class="c"><i class="ti ti-tree" style="font-size:56px;color:var(--br2)"></i><div style="font-family:'Aref Ruqaa',serif;font-size:28px;color:var(--br2);margin-bottom:20px">وين مكانك في الشجرة؟</div></div>` +
    (ppl.length ? `<button class="b w" data-a="ob" data-v="1" style="padding:14px">أنا موجود في الشجرة</button><button class="o w" data-a="ob" data-v="2" style="padding:14px">ما لقيت نفسي، اطلب إضافتي</button>` : `<p class="c">الشجرة لسا فاضية، انتظر المدير يضيف الأفخاذ والأفراد.</p>`);
  else if (S.ob === 1) body = `<input id="s2" placeholder="ابحث عن اسمك" value="${esc(S.q)}"><div id="ls2">${claimList()}</div><button class="lk" data-a="ob" data-v="0">رجوع</button>`;
  else body = `<label for="rn">اسمك</label><input id="rn"><label for="rf">اسم أبوك</label><select id="rf">${ppl.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${esc(bName(p.branchId))}</option>`).join("")}</select><div class="err" id="aerr"></div><button class="b w" data-a="request" style="padding:13px">إرسال الطلب للمدير</button><button class="lk" data-a="ob" data-v="0">رجوع</button>`;
  app.innerHTML = `<div class="top"><span style="width:40px"></span><h3>أهلًا فيك</h3><span style="width:40px"></span></div><div class="bd">${body}<p class="c" style="margin-top:24px">${logoutBtn}</p></div>`;
}
const claimList = () => approved().filter(p => !p.uid && (p.name || "").includes(S.q)).map(p => `<div class="row" data-a="claim" data-id="${esc(p.id)}">${ini(p)}<div>${esc(p.name)}<div class="mut">ابن ${esc(byId(p.fatherId)?.name || "—")} · ${esc(bName(p.branchId))}</div></div></div>`).join("") || '<p class="mut c">ما لقيت أحد</p>';
function pendingView() { app.innerHTML = `<div class="center-screen c"><i class="ti ti-hourglass" style="font-size:56px"></i><div style="font-size:19px">طلبك بانتظار موافقة المدير</div><p class="mut">أول ما يوافق تظهر لك الشجرة تلقائيًا.</p>${logoutBtn}</div>`; }

// ---------------- الشاشة الرئيسية ----------------
const TABS = [["binary-tree-2", "الشجرة"], ["news", "الأخبار"], ["users", "الأعضاء"]];
function render() {
  if (!cfgOk) { app.innerHTML = `<div class="center-screen c"><i class="ti ti-settings" style="font-size:50px"></i><div style="font-size:18px">لازم تلصق إعدادات Firebase داخل ملف index.html</div><p class="mut">انظر خطوات README.</p></div>`; return; }
  if (S.user === undefined) { app.innerHTML = `<div class="center-screen c">جاري التحميل…</div>`; return; }
  if (!S.user) { authView(); return; }
  if (S.err) { app.innerHTML = `<div class="center-screen c"><div style="font-size:18px">تعذر تحميل البيانات</div><p class="mut" dir="ltr">${esc(S.err)}</p><p class="mut">تأكد إنك لصقت القواعد (firestore.rules) في Firestore.</p><button class="b" data-a="logout">تسجيل خروج</button></div>`; return; }
  if (!(S.got.me && S.got.people && S.got.branches) || !S.me) { app.innerHTML = `<div class="center-screen c">جاري التحميل…</div>`; return; }
  if (!isAdmin()) { if (!mine()) { onboardView(); return; } if (mine().status !== "approved") { pendingView(); return; } }
  const pend = S.people.filter(p => p.status !== "approved").length;
  const b = S.branches.find(x => x.id === S.branchId);
  const back = !!S.profile || (S.tab === 0 && b);
  const title = S.profile ? "الملف الشخصي" : S.tab === 0 ? (b ? b.name : (S.meta?.familyName || "شجرة العائلة")) : S.tab === 1 ? "أخبار العائلة" : "أعضاء العائلة";
  const body = S.profile ? profileView() : S.tab === 0 ? treeTab() : S.tab === 1 ? newsTab() : membersTab();
  const keep = document.activeElement && document.activeElement.id === "s" ? document.activeElement.selectionStart : null;
  const scroll = app.querySelector(".bd")?.scrollTop || 0;
  app.innerHTML = `<div class="top"><button class="ib" data-a="${back ? "back" : "me"}" aria-label="${back ? "رجوع" : "ملفي"}">${back ? '<i class="ti ti-arrow-right"></i>' : (mine() ? '<i class="ti ti-user-circle"></i>' : "")}</button><h3>${esc(title)}</h3><button class="ib" data-a="menu" aria-label="القائمة"><i class="ti ti-dots-vertical"></i></button></div><div class="bd">${body}</div>
<nav class="nav">${TABS.map((t, i) => `<button class="${!S.profile && S.tab === i ? "on" : ""}" data-a="tab" data-i="${i}"><i class="ti ti-${t[0]}"></i><span>${t[1]}${i === 2 && isAdmin() && pend ? `<span class="badge">${pend}</span>` : ""}</span></button>`).join("")}</nav>`;
  app.querySelector(".bd").scrollTop = scroll;
  if (keep !== null) { const s = $("s"); if (s) { s.focus(); s.setSelectionRange(keep, keep); } }
}

// ---------------- الأحداث ----------------
const A = {
  tab: d => { S.tab = +d.i; S.profile = null; if (S.tab === 0) S.branchId = null; render(); },
  back: () => { if (S.profile) S.profile = null; else S.branchId = null; render(); },
  me: () => { if (mine()) { S.profile = mine().id; render(); } },
  prof: d => { S.profile = d.id; render(); },
  openB: d => { S.branchId = d.id; S.organic = false; render(); },
  view: d => { S.organic = d.v === "tree"; render(); },
  menu: () => sheet([...(isAdmin() ? [{ label: "تعديل اسم العائلة", fn: renameFamily }] : []), { label: "تسجيل خروج", fn: () => signOut(auth) }]),
  logout: () => signOut(auth),
  toggleReg: () => { S.reg = !S.reg; authView(); },
  login: async () => {
    const em = $("em").value.trim(), pw = $("pw").value; aerr("");
    if (!em || !pw) return aerr("اكتب الإيميل وكلمة المرور");
    $("go").disabled = true;
    try { S.reg ? await createUserWithEmailAndPassword(auth, em, pw) : await signInWithEmailAndPassword(auth, em, pw); }
    catch (e) { aerr(authMsg(e.code)); const g = $("go"); if (g) g.disabled = false; }
  },
  reset: async () => { const em = $("em").value.trim(); if (!em) return aerr("اكتب الإيميل أول"); try { await sendPasswordResetEmail(auth, em); aerr("أرسلنا رابط تغيير كلمة المرور لإيميلك", true); } catch (e) { aerr(authMsg(e.code)); } },
  ob: d => { S.ob = +d.v; S.q = ""; render(); },
  claim: async d => {
    const p = byId(d.id); if (!p || !(await confirmBox(`تأكيد: أنت ${p.name}؟`))) return;
    const b = writeBatch(db); b.update(doc(db, "people", p.id), { uid: S.user.uid }); b.update(doc(db, "users", S.user.uid), { personId: p.id }); await b.commit();
  },
  request: async () => {
    const name = $("rn").value.trim(), f = byId($("rf").value);
    if (!name || !f) return aerr("اكتب اسمك واختر أبوك");
    const ref = doc(collection(db, "people")), b = writeBatch(db);
    b.set(ref, { name, fatherId: f.id, branchId: f.branchId, uid: S.user.uid, status: "pending", job: "", city: "", bio: "", photo: null, birthDate: null, deathDate: null, createdAt: serverTimestamp() });
    b.update(doc(db, "users", S.user.uid), { personId: ref.id }); await b.commit();
  },
  newBranch: async () => {
    const v = await ask("فخذ جديد", [{ k: "n", label: "اسم الفخذ", ph: "مثال: فخذ إبراهيم" }, { k: "h", label: "اسم رأس الفخذ" }], "إنشاء", v => (!v.n || !v.h) ? "اكتب الاسمين" : "");
    if (!v) return;
    const br = doc(collection(db, "branches")), pr = doc(collection(db, "people")), b = writeBatch(db);
    b.set(br, { name: v.n, createdAt: serverTimestamp() }); b.set(pr, newPerson(v.h, null, br.id)); await b.commit();
  },
  addMember: async () => {
    const m = approved().filter(p => p.branchId === S.branchId); if (!m.length) return;
    const v = await ask("إضافة فرد", [{ k: "n", label: "الاسم" }, { k: "f", type: "select", label: "اسم الأب", options: m.map(p => ({ v: p.id, l: p.name })) }], "إضافة", v => v.n ? "" : "اكتب الاسم");
    if (v) await addDoc(collection(db, "people"), newPerson(v.n, v.f, S.branchId));
  },
  approve: d => updateDoc(doc(db, "people", d.id), { status: "approved" }),
  reject: async d => { if (await confirmBox("رفض هذا الطلب؟")) await deleteDoc(doc(db, "people", d.id)); },
  addNews: async () => {
    const v = await ask("خبر جديد", [{ k: "t", type: "select", label: "النوع", options: Object.entries(NT).map(([k, x]) => ({ v: k, l: x[0] })) }, { k: "x", type: "textarea", label: "نص الخبر" }], "نشر", v => v.x ? "" : "اكتب نص الخبر");
    if (v) await addDoc(collection(db, "news"), { type: v.t, text: v.x, createdAt: serverTimestamp() });
  },
  delNews: async d => { if (await confirmBox("حذف هذا الخبر؟")) await deleteDoc(doc(db, "news", d.id)); },
  editBio: async d => { const p = byId(d.id); const v = await ask("نبذة عن " + p.name, [{ k: "b", type: "textarea", label: "النبذة", value: p.bio }]); if (v) await updateDoc(doc(db, "people", p.id), { bio: v.b }); },
  editInfo: async d => {
    const p = byId(d.id);
    const v = await ask("تعديل المعلومات", [{ k: "job", label: "الوظيفة", value: p.job }, { k: "city", label: "المدينة", value: p.city }, { k: "b", type: "date", label: "تاريخ الميلاد", value: p.birthDate || "" }, { k: "dead", type: "check", label: "متوفي (رحمه الله)", value: !!p.deathDate }, { k: "d", type: "date", label: "تاريخ الوفاة", value: p.deathDate || "", showIf: "dead" }], "حفظ",
      v => v.dead && !v.d ? "اكتب تاريخ الوفاة" : (v.dead && v.b && v.d < v.b ? "تاريخ الوفاة لازم يكون بعد الميلاد" : ""));
    if (v) await updateDoc(doc(db, "people", p.id), { job: v.job, city: v.city, birthDate: v.b || null, deathDate: v.dead ? v.d : null });
  },
  photo: d => pickPhoto(d.id),
  delPhoto: d => updateDoc(doc(db, "people", d.id), { photo: null }),
  delPerson: async d => {
    if (d.kids === "1") { await ask("تنبيه", [{ type: "msg", text: "احذف الأبناء أول." }], "حسنًا"); return; }
    const p = byId(d.id); if (await confirmBox(`حذف ${p.name} من الشجرة؟`)) { await deleteDoc(doc(db, "people", p.id)); S.profile = null; render(); }
  }
};
const newPerson = (name, fatherId, branchId) => ({ name, fatherId, branchId, uid: null, status: "approved", job: "", city: "", bio: "", photo: null, birthDate: null, deathDate: null, createdAt: serverTimestamp() });
async function renameFamily() { const v = await ask("اسم العائلة", [{ k: "n", label: "الاسم", value: S.meta?.familyName || "" }], "حفظ", v => v.n ? "" : "اكتب الاسم"); if (v) await updateDoc(doc(db, "meta", "app"), { familyName: v.n }); }
function pickPhoto(id) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const s = 160, m = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = s;
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(img.src);
      updateDoc(doc(db, "people", id), { photo: c.toDataURL("image/jpeg", .6).split(",")[1] });
    };
    img.src = URL.createObjectURL(f);
  };
  i.click();
}
document.addEventListener("click", e => { const t = e.target.closest("[data-a]"); if (t && A[t.dataset.a] && !$("modal").contains(t)) A[t.dataset.a](t.dataset, e); });
document.addEventListener("input", e => {
  if (e.target.id === "s") { S.q = e.target.value; $("ls").innerHTML = membersList(); }
  if (e.target.id === "s2") { S.q = e.target.value; $("ls2").innerHTML = claimList(); }
});

// ---------------- التشغيل ----------------
if (cfgOk) {
  const fb = initializeApp(firebaseConfig); auth = getAuth(fb); db = getFirestore(fb);
  onAuthStateChanged(auth, async u => {
    stop(); S.user = u; S.me = null; S.profile = null; S.branchId = null; S.tab = 0; S.ob = 0; S.q = "";
    if (!u) { render(); return; }
    render();
    try { await ensureUser(u); start(u); } catch (e) { S.err = (e.code || "") + " — " + e.message; render(); }
  });
}
render();
</script>
</body>
</html>
